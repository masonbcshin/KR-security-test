name: OpenDART 2026Q2 parser smoke

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - scripts/discover_opendart_bulk_financials.py
      - scripts/stage_opendart_bulk_financials.py
      - .github/workflows/opendart-2026q2-parser-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALPHAKRX_SHA: e773d4243b7a644dd0c525daccebdf062bc389a1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install staging/parser dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas numpy

      - name: Safety and syntax guard
        run: |
          python -m py_compile \
            scripts/discover_opendart_bulk_financials.py \
            scripts/stage_opendart_bulk_financials.py
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/stage_opendart_bulk_financials.py').read_text(encoding='utf-8')
          for token in (
              'ROLES = ("BS", "PL", "CF", "CE")',
              'mutates_database": False',
              '2026',
          ):
              assert token in p, token
          assert 'sqlite3' not in p
          print('staging_no_db_mutation_guard=PASS')
          PY

      - name: Discover current official inventory
        run: |
          python scripts/discover_opendart_bulk_financials.py \
            --output outputs/opendart_discovery

      - name: Stage exact observed 2026Q2 ZIP set
        run: |
          python scripts/stage_opendart_bulk_financials.py \
            --discovery-json outputs/opendart_discovery/discovery.json \
            --year 2026 \
            --quarter 2 \
            --output outputs/opendart_2026q2

      - name: Checkout pinned AlphaKRX parser
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/yeonghun00/AlphaKRX.git work/AlphaKRX
          git -C work/AlphaKRX checkout "$ALPHAKRX_SHA"
          test "$(git -C work/AlphaKRX rev-parse HEAD)" = "$ALPHAKRX_SHA"

      - name: Parse staged ZIPs into disposable SQLite
        env:
          PYTHONPATH: work/AlphaKRX
        run: |
          mkdir -p outputs/parser_smoke
          python - <<'PY'
          import json, sqlite3, sys
          from pathlib import Path
          sys.path.insert(0, 'work/AlphaKRX')
          from etl.financial_etl import FinancialDataLoader

          db=Path('outputs/parser_smoke/financial_smoke.db')
          raw=Path('outputs/opendart_2026q2/raw_financial')
          loader=FinancialDataLoader(str(db), str(raw))
          loader.connect()
          try:
              loader.create_tables()
              stats=loader.process_all('2026_2Q_*.zip')
          finally:
              loader.close()

          with sqlite3.connect(db) as con:
              periods=con.execute('SELECT COUNT(*) FROM financial_periods').fetchone()[0]
              bs_cf=con.execute('SELECT COUNT(*) FROM financial_items_bs_cf').fetchone()[0]
              pl=con.execute('SELECT COUNT(*) FROM financial_items_pl').fetchone()[0]
              dates=con.execute('SELECT MIN(fiscal_date),MAX(fiscal_date),MIN(REPLACE(available_date,\'-\',\'\')),MAX(REPLACE(available_date,\'-\',\'\')) FROM financial_periods').fetchone()
              std=con.execute("""
                  SELECT COUNT(*) FROM financial_periods
                  WHERE fiscal_month=12 AND fiscal_date='2026-06-30'
                    AND REPLACE(available_date,'-','')='20260816'
              """).fetchone()[0]
              std_bad=con.execute("""
                  SELECT COUNT(*) FROM financial_periods
                  WHERE fiscal_month=12 AND fiscal_date='2026-06-30'
                    AND REPLACE(available_date,'-','')<>'20260816'
              """).fetchone()[0]
              report_types=con.execute("""
                  SELECT report_type,COUNT(*) FROM financial_periods
                  GROUP BY report_type ORDER BY COUNT(*) DESC
              """).fetchall()
              consolidated=con.execute("""
                  SELECT consolidation_type,COUNT(*) FROM financial_periods
                  GROUP BY consolidation_type ORDER BY consolidation_type
              """).fetchall()

          audit={
              'alphakrx_sha':'e773d4243b7a644dd0c525daccebdf062bc389a1',
              'stats':stats,
              'periods':periods,
              'bs_cf_items':bs_cf,
              'pl_items':pl,
              'min_fiscal_date':dates[0],
              'max_fiscal_date':dates[1],
              'min_available_date':dates[2],
              'max_available_date':dates[3],
              'standard_dec_fy_2026q2_available_20260816':std,
              'standard_dec_fy_2026q2_wrong_available_date':std_bad,
              'report_types':report_types,
              'consolidation_types':consolidated,
          }
          if stats.get('errors') != 0:
              raise SystemExit(f"AlphaKRX parser reported errors: {stats}")
          if periods < 1000 or bs_cf < 10000 or pl < 10000:
              raise SystemExit(f"implausibly small parse: {audit}")
          if std < 500 or std_bad != 0:
              raise SystemExit(f"PIT 45/90 rule guard failed: {audit}")
          if dates[1] != '2026-06-30':
              raise SystemExit(f"unexpected max fiscal date: {audit}")
          Path('outputs/parser_smoke/audit.json').write_text(
              json.dumps(audit,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(audit,ensure_ascii=False,indent=2))
          PY

      - name: Upload staging and parser audit
        uses: actions/upload-artifact@v4
        with:
          name: kr-opendart-2026q2-parser-smoke
          path: |
            outputs/opendart_discovery/discovery.json
            outputs/opendart_2026q2/manifest.json
            outputs/opendart_2026q2/raw_financial/*.zip
            outputs/parser_smoke/audit.json
          if-no-files-found: error
          retention-days: 14

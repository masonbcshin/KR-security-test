name: OpenDART 2026Q2 parser smoke

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - scripts/discover_opendart_bulk_financials.py
      - scripts/stage_opendart_bulk_financials.py
      - scripts/generate_personal_quant_etf_orders.py
      - .github/workflows/opendart-2026q2-parser-smoke.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-smoke:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ALPHAKRX_SHA: e773d4243b7a644dd0c525daccebdf062bc389a1
      BASE_CACHE_KEY: kr-research-db-v4-e773d4243b7a644dd0c525daccebdf062bc389a1-${{ hashFiles('scripts/build_marcap_db.py', 'scripts/build_marcap_db_ci.py') }}-2011-2026-2015-2025
      REFRESH_CACHE_KEY: kr-research-db-v5-e773d4243b7a644dd0c525daccebdf062bc389a1-${{ hashFiles('scripts/build_marcap_db.py', 'scripts/build_marcap_db_ci.py') }}-2011-2026-opendart-2026q2
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install staging/parser dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pandas numpy

      - name: Safety and syntax guard
        run: |
          python -m py_compile \
            scripts/discover_opendart_bulk_financials.py \
            scripts/stage_opendart_bulk_financials.py \
            scripts/generate_personal_quant_etf_orders.py
          python - <<'PY'
          from pathlib import Path
          p=Path('scripts/stage_opendart_bulk_financials.py').read_text(encoding='utf-8')
          for token in (
              'ROLES = ("BS", "PL", "CF", "CE")',
              'mutates_database": False',
              'https://opendart.fss.or.kr/cmm/downloadFnlttZip.do',
          ):
              assert token in p, token
          assert 'sqlite3' not in p
          assert 'FinancialDataLoader' not in p
          q=Path('scripts/generate_personal_quant_etf_orders.py').read_text(encoding='utf-8')
          for token in ('EQUITY_EXPOSURE = 0.60','SAFE_EXPOSURE = 0.40','"safe": "214980"','HORIZON = 84'):
              assert token in q, token
          print('staging_no_db_mutation_guard=PASS')
          print('core_identity_guard=PASS')
          PY

      - name: Discover current official inventory
        run: |
          python scripts/discover_opendart_bulk_financials.py \
            --output outputs/opendart_discovery

      - name: Stage exact observed 2026Q2 ZIP set
        run: |
          python scripts/stage_opendart_bulk_financials.py \
            --discovery-json outputs/opendart_discovery/discovery.json \
            --year 2026 \
            --quarter 2 \
            --output outputs/opendart_2026q2

      - name: Checkout pinned AlphaKRX parser
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/yeonghun00/AlphaKRX.git work/AlphaKRX
          git -C work/AlphaKRX checkout "$ALPHAKRX_SHA"
          test "$(git -C work/AlphaKRX rev-parse HEAD)" = "$ALPHAKRX_SHA"

      - name: Parse staged ZIPs into disposable SQLite
        env:
          PYTHONPATH: work/AlphaKRX
        run: |
          mkdir -p outputs/parser_smoke
          python - <<'PY'
          import json, sqlite3, sys
          from pathlib import Path
          sys.path.insert(0, 'work/AlphaKRX')
          from etl.financial_etl import FinancialDataLoader

          db=Path('outputs/parser_smoke/financial_smoke.db')
          raw=Path('outputs/opendart_2026q2/raw_financial')
          loader=FinancialDataLoader(str(db), str(raw))
          loader.connect()
          try:
              loader.create_tables()
              stats=loader.process_all('2026_2Q_*.zip')
          finally:
              loader.close()

          with sqlite3.connect(db) as con:
              periods=con.execute('SELECT COUNT(*) FROM financial_periods').fetchone()[0]
              bs_cf=con.execute('SELECT COUNT(*) FROM financial_items_bs_cf').fetchone()[0]
              pl=con.execute('SELECT COUNT(*) FROM financial_items_pl').fetchone()[0]
              dates=con.execute("SELECT MIN(fiscal_date),MAX(fiscal_date),MIN(REPLACE(available_date,'-','')),MAX(REPLACE(available_date,'-','')) FROM financial_periods").fetchone()
              std=con.execute("SELECT COUNT(*) FROM financial_periods WHERE fiscal_month=12 AND fiscal_date='2026-06-30' AND REPLACE(available_date,'-','')='20260816'").fetchone()[0]
              std_bad=con.execute("SELECT COUNT(*) FROM financial_periods WHERE fiscal_month=12 AND fiscal_date='2026-06-30' AND REPLACE(available_date,'-','')<>'20260816'").fetchone()[0]
          audit={
              'alphakrx_sha':'e773d4243b7a644dd0c525daccebdf062bc389a1',
              'stats':stats,'periods':periods,'bs_cf_items':bs_cf,'pl_items':pl,
              'min_fiscal_date':dates[0],'max_fiscal_date':dates[1],
              'min_available_date':dates[2],'max_available_date':dates[3],
              'standard_dec_fy_2026q2_available_20260816':std,
              'standard_dec_fy_2026q2_wrong_available_date':std_bad,
          }
          if stats.get('errors') != 0 or periods < 1000 or bs_cf < 10000 or pl < 10000:
              raise SystemExit(f'parser coverage failed: {audit}')
          if std < 4700 or std_bad != 0 or dates[1] != '2026-06-30' or dates[3] != '20260816':
              raise SystemExit(f'PIT guard failed: {audit}')
          Path('outputs/parser_smoke/audit.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(audit,ensure_ascii=False,indent=2))
          PY

      - name: Restore immutable v4 research DB
        id: basecache
        uses: actions/cache/restore@v4
        with:
          path: work/krx_stock_data.db
          key: ${{ env.BASE_CACHE_KEY }}

      - name: Require exact base cache and copy it
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.basecache.outputs.cache-hit }}" = "true"
          test -s work/krx_stock_data.db
          mkdir -p outputs/db_refresh
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          with sqlite3.connect('work/krx_stock_data.db') as con:
              x={
                'daily_prices':con.execute('SELECT MIN(date),MAX(date),COUNT(*) FROM daily_prices').fetchone(),
                'adj_daily_prices':con.execute('SELECT MIN(date),MAX(date),COUNT(*) FROM adj_daily_prices').fetchone(),
                'financial_periods':con.execute("SELECT COUNT(*),MIN(REPLACE(available_date,'-','')),MAX(REPLACE(available_date,'-','')) FROM financial_periods").fetchone(),
                'financial_bs_cf':con.execute('SELECT COUNT(*) FROM financial_items_bs_cf').fetchone()[0],
                'financial_pl':con.execute('SELECT COUNT(*) FROM financial_items_pl').fetchone()[0],
              }
          Path('outputs/db_refresh/base_before.json').write_text(json.dumps(x,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(x,ensure_ascii=False,indent=2))
          PY
          cp --reflink=auto work/krx_stock_data.db work/krx_stock_data_v5.db
          test -s work/krx_stock_data_v5.db

      - name: Import staged 2026Q2 into research DB copy
        env:
          PYTHONPATH: work/AlphaKRX
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0,'work/AlphaKRX')
          from etl.financial_etl import FinancialDataLoader
          loader=FinancialDataLoader('work/krx_stock_data_v5.db','outputs/opendart_2026q2/raw_financial')
          loader.connect()
          try:
              loader.create_tables()
              stats=loader.process_all('2026_2Q_*.zip')
          finally:
              loader.close()
          if stats.get('errors') != 0:
              raise SystemExit(stats)
          Path('outputs/db_refresh/import_stats.json').write_text(json.dumps(stats,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(stats,ensure_ascii=False,indent=2))
          PY

      - name: Audit refreshed research DB copy
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, sqlite3
          from pathlib import Path
          before=json.loads(Path('outputs/db_refresh/base_before.json').read_text(encoding='utf-8'))
          with sqlite3.connect('work/krx_stock_data_v5.db') as con:
              daily=con.execute('SELECT MIN(date),MAX(date),COUNT(*) FROM daily_prices').fetchone()
              adj=con.execute('SELECT MIN(date),MAX(date),COUNT(*) FROM adj_daily_prices').fetchone()
              fin=con.execute("SELECT COUNT(*),MIN(REPLACE(available_date,'-','')),MAX(REPLACE(available_date,'-','')) FROM financial_periods").fetchone()
              bs_cf=con.execute('SELECT COUNT(*) FROM financial_items_bs_cf').fetchone()[0]
              pl=con.execute('SELECT COUNT(*) FROM financial_items_pl').fetchone()[0]
              q2=con.execute("SELECT COUNT(*) FROM financial_periods WHERE fiscal_date='2026-06-30'").fetchone()[0]
              std=con.execute("SELECT COUNT(*) FROM financial_periods WHERE fiscal_month=12 AND fiscal_date='2026-06-30' AND REPLACE(available_date,'-','')='20260816'").fetchone()[0]
              std_bad=con.execute("SELECT COUNT(*) FROM financial_periods WHERE fiscal_month=12 AND fiscal_date='2026-06-30' AND REPLACE(available_date,'-','')<>'20260816'").fetchone()[0]
              dup=con.execute("SELECT COUNT(*) FROM (SELECT stock_code,fiscal_date,consolidation_type,COUNT(*) c FROM financial_periods GROUP BY stock_code,fiscal_date,consolidation_type HAVING c>1)").fetchone()[0]
              integrity=con.execute('PRAGMA integrity_check').fetchone()[0]
          audit={'daily_prices':daily,'adj_daily_prices':adj,'financial_periods':fin,'financial_bs_cf':bs_cf,'financial_pl':pl,'q2_periods':q2,'standard_dec_fy_2026q2_available_20260816':std,'standard_dec_fy_2026q2_wrong_available_date':std_bad,'duplicate_period_keys':dup,'sqlite_integrity_check':integrity}
          if list(daily)!=list(before['daily_prices']) or list(adj)!=list(before['adj_daily_prices']):
              raise SystemExit(f'market layer changed: before={before} after={audit}')
          if fin[2]!='20260816' or q2<4800 or std<4700 or std_bad!=0:
              raise SystemExit(f'PIT refresh failed: {audit}')
          if fin[0]<=before['financial_periods'][0] or bs_cf<=before['financial_bs_cf'] or pl<=before['financial_pl']:
              raise SystemExit(f'financial counts did not increase: before={before} after={audit}')
          if dup!=0 or integrity!='ok':
              raise SystemExit(f'DB integrity failed: {audit}')
          Path('outputs/db_refresh/refreshed_db_audit.json').write_text(json.dumps(audit,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(audit,ensure_ascii=False,indent=2))
          PY

      - name: Install live-target dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          pip install finance-datareader==0.9.201

      - name: Generate fixed 60/40 PAPER-Core targets from refreshed DB
        shell: bash
        run: |
          set -euo pipefail
          python scripts/generate_personal_quant_etf_orders.py \
            --alphakrx-root work/AlphaKRX \
            --db work/krx_stock_data_v5.db \
            --output outputs/refreshed_live \
            --capitals 10000000,30000000,100000000 | tee outputs/db_refresh/live_target.log

      - name: Require DATA_READY and fixed strategy identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          x=json.loads(Path('outputs/refreshed_live/live_status.json').read_text(encoding='utf-8'))
          assert x['strategy_id']=='PQ-CORE-60-40-214980-V1', x
          assert abs(float(x['equity_exposure'])-0.60)<1e-12, x
          assert abs(float(x['defensive_exposure'])-0.40)<1e-12, x
          assert x['defensive_code']=='214980', x
          assert int(x['horizon_trading_days'])==84, x
          assert x['latest_financial_available_date']=='20260816', x
          assert x['financial_fresh'] is True, x
          assert x['DATA_READY'] is True and x['LIVE_READY'] is True, x
          assert x['blocking_reason'] is None, x
          print(json.dumps(x,ensure_ascii=False,indent=2))
          PY

      - name: Save validated v5 cache for this PR
        uses: actions/cache/save@v4
        with:
          path: work/krx_stock_data_v5.db
          key: ${{ env.REFRESH_CACHE_KEY }}

      - name: Upload staging parser refresh and target audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kr-opendart-2026q2-parser-smoke
          path: |
            outputs/opendart_discovery/discovery.json
            outputs/opendart_2026q2/manifest.json
            outputs/opendart_2026q2/download_diagnostics/*.json
            outputs/parser_smoke/audit.json
            outputs/db_refresh/**/*
            outputs/refreshed_live/**/*
          if-no-files-found: warn
          retention-days: 30

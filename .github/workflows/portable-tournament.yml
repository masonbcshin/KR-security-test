name: Portable KR strategy tournament

on:
  pull_request:
  workflow_dispatch:
    inputs:
      tier:
        description: "smoke or full"
        required: true
        default: smoke
        type: choice
        options: [smoke, full]

permissions:
  contents: read

jobs:
  tournament:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      ALPHAKRX_SHA: e773d4243b7a644dd0c525daccebdf062bc389a1
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Resolve test tier
        id: tier
        shell: bash
        run: |
          set -euo pipefail
          TIER="${{ github.event.inputs.tier || 'smoke' }}"
          if [[ "$TIER" == "full" ]]; then
            # 2011 provides >756 trading days of price warmup before 2015 features.
            echo "data_start_year=2011" >> "$GITHUB_OUTPUT"
            echo "data_end_year=2026" >> "$GITHUB_OUTPUT"
            echo "financial_start_year=2015" >> "$GITHUB_OUTPUT"
            echo "financial_end_year=2025" >> "$GITHUB_OUTPUT"
            echo "feature_start=20150101" >> "$GITHUB_OUTPUT"
            echo "test_start=20180101" >> "$GITHUB_OUTPUT"
            echo "end=20260320" >> "$GITHUB_OUTPUT"
          else
            echo "data_start_year=2018" >> "$GITHUB_OUTPUT"
            echo "data_end_year=2024" >> "$GITHUB_OUTPUT"
            echo "financial_start_year=2019" >> "$GITHUB_OUTPUT"
            echo "financial_end_year=2024" >> "$GITHUB_OUTPUT"
            echo "feature_start=20210101" >> "$GITHUB_OUTPUT"
            echo "test_start=20240101" >> "$GITHUB_OUTPUT"
            echo "end=20241231" >> "$GITHUB_OUTPUT"
          fi
          echo "tier=$TIER" >> "$GITHUB_OUTPUT"

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y sqlite3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Checkout fixed AlphaKRX research engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor
          git clone --filter=blob:none --no-checkout https://github.com/yeonghun00/AlphaKRX.git vendor/alphakrx
          git -C vendor/alphakrx sparse-checkout init --cone
          git -C vendor/alphakrx sparse-checkout set etl ml data/raw_financial
          git -C vendor/alphakrx fetch --depth=1 origin "$ALPHAKRX_SHA"
          git -C vendor/alphakrx checkout --detach FETCH_HEAD
          test -f vendor/alphakrx/etl/financial_etl.py
          test -f vendor/alphakrx/data/raw_financial/2018_4Q_BS_20250605032425.zip

      - name: Syntax check
        run: python -m py_compile scripts/build_marcap_db.py scripts/build_marcap_db_ci.py scripts/run_portable_tournament.py scripts/run_portable_tournament_ci.py

      - name: Cache marcap yearly parquet
        uses: actions/cache@v4
        with:
          path: .cache/marcap
          key: marcap-${{ runner.os }}-${{ steps.tier.outputs.data_start_year }}-${{ steps.tier.outputs.data_end_year }}

      - name: Restore research DB cache
        id: dbcache
        uses: actions/cache/restore@v4
        with:
          path: work/krx_stock_data.db
          key: kr-research-db-v4-${{ env.ALPHAKRX_SHA }}-${{ hashFiles('scripts/build_marcap_db.py', 'scripts/build_marcap_db_ci.py') }}-${{ steps.tier.outputs.data_start_year }}-${{ steps.tier.outputs.data_end_year }}-${{ steps.tier.outputs.financial_start_year }}-${{ steps.tier.outputs.financial_end_year }}

      - name: Build marcap price DB
        if: steps.dbcache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs work
          python scripts/build_marcap_db_ci.py \
            --phase prices \
            --alphakrx-root vendor/alphakrx \
            --db work/krx_stock_data.db \
            --start-year "${{ steps.tier.outputs.data_start_year }}" \
            --end-year "${{ steps.tier.outputs.data_end_year }}" | tee outputs/prices.log

      - name: Load PIT financials
        if: steps.dbcache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_marcap_db_ci.py \
            --phase financial \
            --alphakrx-root vendor/alphakrx \
            --db work/krx_stock_data.db \
            --start-year "${{ steps.tier.outputs.data_start_year }}" \
            --end-year "${{ steps.tier.outputs.data_end_year }}" \
            --financial-start-year "${{ steps.tier.outputs.financial_start_year }}" \
            --financial-end-year "${{ steps.tier.outputs.financial_end_year }}" | tee outputs/financial.log

      - name: Build adjusted prices
        if: steps.dbcache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_marcap_db_ci.py \
            --phase adjusted \
            --alphakrx-root vendor/alphakrx \
            --db work/krx_stock_data.db \
            --start-year "${{ steps.tier.outputs.data_start_year }}" \
            --end-year "${{ steps.tier.outputs.data_end_year }}" | tee outputs/adjusted.log

      - name: Audit research DB
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs
          python scripts/build_marcap_db_ci.py \
            --phase audit \
            --alphakrx-root vendor/alphakrx \
            --db work/krx_stock_data.db \
            --start-year "${{ steps.tier.outputs.data_start_year }}" \
            --end-year "${{ steps.tier.outputs.data_end_year }}" | tee outputs/audit.log

      - name: Save research DB cache
        if: steps.dbcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: work/krx_stock_data.db
          key: kr-research-db-v4-${{ env.ALPHAKRX_SHA }}-${{ hashFiles('scripts/build_marcap_db.py', 'scripts/build_marcap_db_ci.py') }}-${{ steps.tier.outputs.data_start_year }}-${{ steps.tier.outputs.data_end_year }}-${{ steps.tier.outputs.financial_start_year }}-${{ steps.tier.outputs.financial_end_year }}

      - name: Run portable tournament
        shell: bash
        run: |
          set -euo pipefail
          python scripts/run_portable_tournament_ci.py \
            --alphakrx-root vendor/alphakrx \
            --db work/krx_stock_data.db \
            --feature-start "${{ steps.tier.outputs.feature_start }}" \
            --test-start "${{ steps.tier.outputs.test_start }}" \
            --end "${{ steps.tier.outputs.end }}" \
            --output outputs/tournament | tee outputs/tournament.log

      - name: Print comparison
        if: always()
        shell: bash
        run: |
          if [[ -f outputs/tournament/comparison.csv ]]; then
            echo "### Tournament comparison" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cat outputs/tournament/comparison.csv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f outputs/data_audit.json ]]; then
            echo "### Data audit" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat outputs/data_audit.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload compact research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kr-portable-tournament-${{ steps.tier.outputs.tier }}
          path: |
            outputs/**/*.csv
            outputs/**/*.json
            outputs/**/*.md
            outputs/*.log
          if-no-files-found: warn
          retention-days: 14

name: OpenDART bulk financial discovery

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
    paths:
      - scripts/discover_opendart_bulk_financials.py
      - .github/workflows/opendart-bulk-discovery.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  discover:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.number == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install discovery dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Syntax and safety guard
        run: |
          python -m py_compile scripts/discover_opendart_bulk_financials.py
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/discover_opendart_bulk_financials.py').read_text(encoding='utf-8')
          for token in (
              'https://opendart.fss.or.kr/disclosureinfo/fnltt/dwld/main.do',
              'https://opendart.fss.or.kr/disclosureinfo/fnltt/dwld/list.do',
              'downloads_financial_zip": False',
              'mutates_database": False',
              'weakens_pit_freshness_gate": False',
          ):
              assert token in p, token
          assert 'sqlite3' not in p
          print('opendart_discovery_safety_guard=PASS')
          PY

      - name: Probe official OpenDART inventory
        run: |
          python scripts/discover_opendart_bulk_financials.py \
            --output outputs/opendart_bulk_discovery | tee outputs-opendart-discovery.log

      - name: Print compact discovered inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          x = json.loads(Path('outputs/opendart_bulk_discovery/discovery.json').read_text(encoding='utf-8'))
          print('status=', x['status'])
          print('inventory_count=', x['inventory_count'])
          print('business_years=', x['business_years'])
          print('latest_business_year=', x['latest_business_year'])
          for row in x['inventory_records'][:40]:
              print(json.dumps(row, ensure_ascii=False)[:3000])
          PY

      - name: Upload immutable discovery snapshot
        uses: actions/upload-artifact@v4
        with:
          name: kr-opendart-bulk-discovery
          path: |
            outputs/opendart_bulk_discovery/
            outputs-opendart-discovery.log
          if-no-files-found: error
          retention-days: 14

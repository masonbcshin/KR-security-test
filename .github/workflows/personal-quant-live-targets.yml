name: Personal-quant ETF live targets

on:
  pull_request:
    paths:
      - scripts/generate_personal_quant_etf_orders.py
      - .github/workflows/personal-quant-live-targets.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ALPHAKRX_SHA: e773d4243b7a644dd0c525daccebdf062bc389a1
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install finance-datareader==0.9.201

      - name: Checkout pinned AlphaKRX feature engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor
          git clone --filter=blob:none --no-checkout https://github.com/yeonghun00/AlphaKRX.git vendor/alphakrx
          git -C vendor/alphakrx sparse-checkout init --cone
          git -C vendor/alphakrx sparse-checkout set ml
          git -C vendor/alphakrx fetch --depth=1 origin "$ALPHAKRX_SHA"
          git -C vendor/alphakrx checkout --detach FETCH_HEAD

      - name: Syntax check
        run: >-
          python -m py_compile
          scripts/run_portable_tournament.py
          scripts/run_long_reversal_challenger.py
          scripts/generate_personal_quant_etf_orders.py

      - name: Restore cached full research DB
        id: dbcache
        uses: actions/cache/restore@v4
        with:
          path: work/krx_stock_data.db
          key: kr-research-db-v4-${{ env.ALPHAKRX_SHA }}-${{ hashFiles('scripts/build_marcap_db.py', 'scripts/build_marcap_db_ci.py') }}-2011-2026-2015-2025

      - name: Require full DB cache hit
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.dbcache.outputs.cache-hit }}" = "true"
          test -s work/krx_stock_data.db

      - name: Generate provisional target holdings
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p outputs
          python scripts/generate_personal_quant_etf_orders.py \
            --alphakrx-root vendor/alphakrx \
            --db work/krx_stock_data.db \
            --output outputs/personal_quant_live \
            --capitals 10000000,30000000,100000000 | tee outputs/personal_quant_live.log

      - name: Print live-readiness summary
        if: always()
        shell: bash
        run: |
          if [[ -f outputs/personal_quant_live/live_status.json ]]; then
            echo "### Personal-quant ETF baseline live status" >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat outputs/personal_quant_live/live_status.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
          if [[ -f outputs/personal_quant_live/target_holdings.csv ]]; then
            echo "### Indicative target holdings" >> "$GITHUB_STEP_SUMMARY"
            echo '```csv' >> "$GITHUB_STEP_SUMMARY"
            cat outputs/personal_quant_live/target_holdings.csv >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload target artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kr-personal-quant-live-targets
          path: |
            outputs/personal_quant_live/**/*
            outputs/personal_quant_live.log
          if-no-files-found: warn
          retention-days: 14
